{% extends 'automation/base.html' %}

{% block content %}
<h2 class="text-center mb-4">Create Workflow</h2>
<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label for="id_name">Workflow Name</label>
        {{ form.name }}
    </div>
    <div class="form-group">
        <label for="id_description">Description</label>
        {{ form.description }}
    </div>
    <h4>Steps</h4>
    {% for step in step_choices %}
    <div class="form-row align-items-center mb-2">
        <div class="col-auto">
            <input type="checkbox" id="step{{ forloop.counter }}" name="include_step_{{ forloop.counter }}" value="1">
            <label for="step{{ forloop.counter }}">{{ step.1 }}</label>
        </div>
        <div class="col-auto">
            <input type="number" name="order_{{ forloop.counter }}" min="1" class="form-control" placeholder="Order">
        </div>
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary mt-3">Save Workflow</button>
</form>
{% endblock %}
