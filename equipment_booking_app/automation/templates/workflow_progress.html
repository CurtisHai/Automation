{% extends 'automation/base.html' %}

{% block content %}
<h2 class="text-center mb-4">Workflow Progress</h2>
<div class="w-75 mx-auto" style="color:#192d38;">
    <ul class="list-group mb-3">
    {% for line in logs %}
        <li class="list-group-item">{{ line }}</li>
    {% endfor %}
    </ul>
    {% if not done and run_mode == 'pause' %}
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Continue</button>
    </form>
    {% elif done %}
    <div class="alert alert-success">Workflow completed.</div>
    {% endif %}
</div>
{% endblock %}
