{% extends 'automation/base.html' %}

{% block content %}
<h2 class="text-center mb-4">My Workflows</h2>
<div class="table-responsive">
<table class="table table-striped table-bordered table-hover w-100" style="background-color:#ffffff; width:100%;">
<thead style="background-image: linear-gradient(to right, #05E560, #B9FF00); color:#192d38; text-align:center;">
<tr><th>Name</th><th>Published</th><th>Actions</th></tr>
</thead>
<tbody>
{% for wf in workflows %}
<tr class="text-center">
<td>{{ wf.name }}</td>
<td>{% if wf.is_published %}Yes{% else %}No{% endif %}</td>
<td>
{% if not wf.is_published %}
<a href="{% url 'request_review' wf.id %}" class="btn btn-sm btn-primary">Request Review</a>
{% endif %}
</td>
</tr>
{% empty %}
<tr><td colspan="3" class="text-center">No workflows found.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
