{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AtkinsRéalis Automation App{% endblock %}</title>
    
    <!-- Bootstrap CSS CDN for responsive design and styling -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom font definitions for the app -->
    <style>
        @font-face {
            font-family: 'Gamechanger';
            src: url('{% static "workflow_automation/fonts/Gamechanger-Medium.ttf" %}') format('truetype');
        }
    
        @font-face {
            font-family: 'Bienvenue';
            src: url('{% static "workflow_automation/fonts/Bienvenue-Medium.ttf" %}') format('truetype');
        }
    
        /* Sidebar layout */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            background-color: #192d38;
            width: 250px;
            transition: width 0.3s;
            overflow-x: hidden;
            padding-top: 20px;
            z-index: 1000;
        }

        #sidebar.collapsed {
            width: 60px;
        }

        #sidebar .toggle-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
        }

        #main-content {
            margin-left: 250px;
            transition: margin-left 0.3s;
        }

        body.sidebar-collapsed #main-content {
            margin-left: 60px;
        }
    
        .logo {
            max-height: 40px; 
            margin-right: 20px;
        }
    
        .center-nav {
            font-size: 1.2rem;
            display: flex;
            gap: 10px;
            flex-grow: 1;
            justify-content: center;
            flex-wrap: wrap;
        }
    
        .nav-link {
            padding: 10px 20px;
            background-image: linear-gradient(to right, #05E560, #B9FF00);
            color: #192d38;
            border-radius: 10px;
            text-decoration: none;
            transition: background-image 0.3s ease;
            margin-right: 10px;
            display: inline-block;
        }

        .nav-link:hover {
            background-image: linear-gradient(to right, #B9FF00, #05E560);
            color: #192d38;
        }
    
        #logout-link {
            font-size: 1.2rem;
            margin-left: auto;
        }
    
        .auth-btn {
            background-image: linear-gradient(to right, #05E560, #B9FF00);
            color: #192d38;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.2rem;
            margin-right: 10px;
            transition: background-image 0.3s ease;
            display: inline-block;
        }

        .auth-btn:hover {
            background-image: linear-gradient(to right, #B9FF00, #05E560);
            color: #192d38;
        }
    
        .btn {
            background-image: linear-gradient(to right, #05E560, #B9FF00);
            color: #192d38;
            border: none;
            margin-right: 10px;
            border-radius: 10px;
        }

        .btn:hover {
            background-image: linear-gradient(to right, #B9FF00, #05E560);
            color: #192d38;
        }
    </style>
    

    <!-- Link to the custom CSS file for additional styles -->
    <link rel="stylesheet" href="{% static 'workflow_automation/css/styles.css' %}">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #101e29; color: white;">
    {% include 'workflow_automation/partials/sidebar.html' %}
    <div id="main-content" class="flex-grow-1">

    {% if messages %}
    <div class="container mt-3 mb-4">
        <div class="alert alert-info">
            {% for message in messages %}
            <div class="{% if message.tags %}{{ message.tags }}{% else %}info{% endif %}">{{ message }}</div>
            {% endfor %}
        </div>
    </div>
    {% endif %}

    <main class="container flex-grow-1" style="background-color: #192d38; color: white; border-radius: 6px; padding: 20px;">
        {% block content %}
        {% endblock %}

    </main>
    </div>

    <footer class="mt-auto py-1 text-center" style="background-color: #192d38; color: #ccc; width: 100%;">
        © Curtis Hailes, AtkinsRéalis 2025
    </footer>
    

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        function confirmLogout(event) {
            event.preventDefault();
            const userConfirmed = confirm("Are you sure you want to log out?");
            if (userConfirmed) {
                window.location.href = event.target.href;
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            var toggleBtn = document.getElementById('sidebarToggle');
            var sidebar = document.getElementById('sidebar');
            toggleBtn.addEventListener('click', function() {
                sidebar.classList.toggle('collapsed');
                document.body.classList.toggle('sidebar-collapsed');
            });
        });
    </script>
</body>
</html>
