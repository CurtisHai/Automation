{% extends 'workflow_automation/base.html' %}

{% block content %}
<div class="container mt-5">
  <h2 class="text-center mb-4">Notice Board</h2>

  <style>
    /* Card look to match site */
    .notice-card{
      background: var(--chip-bg, #192d38);
      border-radius: 12px;
      box-shadow: 0 0 0 1px rgba(5,229,96,.14) inset, 0 8px 24px rgba(0,0,0,.25);
      max-width: 820px;
      margin: 0 auto;
    }

    /* Inline layout reused site-wide */
    .notice-form .form-row-inline{
      display:flex; align-items:center; gap:.75rem; margin-bottom:1rem; flex-wrap:nowrap;
    }
    .notice-form .label-fixed{ width:180px; text-align:left; margin:0; }
    .notice-form .field-flex{ flex:1 1 auto; }

    /* Inputs: dark theme */
    .notice-form input,
    .notice-form select,
    .notice-form textarea{
      width:100%;
      background: var(--sidebar-bg,#0f222d);
      color:#e7eff2;
      border:1px solid rgba(255,255,255,.18);
      border-radius:10px;
      padding:.5rem .75rem;
    }
    .notice-form input::placeholder,
    .notice-form textarea::placeholder{ color:#a8b6bf; }
    .notice-form textarea{ min-height:8rem; resize:vertical; }

    .notice-form .invalid-feedback{ color:#ff9aa2; }

    /* Buttons aligned to field width */
    .notice-form .actions-row .label-fixed{ visibility:hidden; }
    .notice-form .actions-row .field-flex .btn{ margin-right:.5rem; } /* gap between buttons */
    .notice-form .actions-row .field-flex .btn:last-child{ margin-right:0; }

    @media (max-width:576px){
      .notice-form .form-row-inline{ flex-wrap:wrap; }
      .notice-form .label-fixed{ width:100%; margin-bottom:.25rem; }
      .notice-form .field-flex{ width:100%; flex:0 0 100%; }
      .notice-form .actions-row .label-fixed{ display:none; }
    }
  </style>

  <div class="card p-4 content-box notice-card">
    <form method="post" class="notice-form">
      {% csrf_token %}

      {% for field in form %}
      <div class="form-row-inline">
        <label for="{{ field.id_for_label }}" class="col-form-label label-fixed">
          {{ field.label }}:
        </label>
        <div class="field-flex">
          {{ field }}
          {% if field.help_text %}
            <small class="form-text text-muted">{{ field.help_text }}</small>
          {% endif %}
          {% if field.errors %}
            <div class="invalid-feedback d-block">{{ field.errors|striptags }}</div>
          {% endif %}
        </div>
      </div>
      {% endfor %}

      <!-- Buttons: Cancel (red) on the left, Save on the right -->
      <div class="form-row-inline actions-row mt-3">
        <div class="label-fixed">.</div>
        <div class="field-flex d-flex">
          <a href="{% url 'launcher' %}" class="btn btn-danger">Cancel</a>
          <button type="submit" class="btn btn-primary">Save Notice</button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
