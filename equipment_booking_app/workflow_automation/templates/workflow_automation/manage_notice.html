{% extends 'workflow_automation/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Notice Board</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Notice</button>
        <a href="{% url 'launcher' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
