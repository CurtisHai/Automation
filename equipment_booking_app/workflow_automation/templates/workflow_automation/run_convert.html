{% extends 'workflow_automation/base.html' %}

{% block content %}
<h2 class="text-center mb-4">Run Convert Tool</h2>
<div class="card p-4 content-box mb-4">
    <form method="post">
        {% csrf_token %}
        <div class="d-none">
            {{ form.input_path }}
        </div>
        <div class="form-group">
            <label>Select Input Folder</label><br>
            <input type="file" id="input_folder_picker" webkitdirectory mozdirectory directory multiple class="d-none">
            <button type="button" class="btn btn-secondary" id="input_folder_btn">Browse</button>
            <span id="input_folder_label" class="ml-2"></span>
        </div>
        <div class="form-group">
            {{ form.format.label_tag }}
            {{ form.format }}
        </div>
        <button type="submit" class="btn btn-primary">Run Convert</button>
    </form>
    {% if files %}
    <h4 class="mt-4">Converted Files</h4>
    <ul>
        {% for f in files %}
        <li>{{ f }}</li>
        {% endfor %}
    </ul>
    {% endif %}
</div>
{% endblock %}
