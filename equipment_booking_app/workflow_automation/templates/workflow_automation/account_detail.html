{% extends 'workflow_automation/base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Your Account Details</h2>

    <!-- Card for form layout with Bootstrap styling -->
    <div class="card p-4 content-box mb-5 account-form">
        <form method="post" action="{% url 'accounts' %}">
            {% csrf_token %}

            <!-- Display username in a readonly input field -->
            <div class="row mb-3">
                <div class="col-4 text-right">
                    <label>Username:</label>
                </div>
                <div class="col-8">
                    <input type="text" class="form-control" value="{{ user.username }}" readonly>
                </div>
            </div>

            <!-- Initials input field -->
            <div class="row mb-3">
                <div class="col-4 text-right">
                    <label for="id_initials">Initials:</label>
                </div>
                <div class="col-8">
                    {{ form.initials }}
                </div>
            </div>

            <!-- Email input field -->
            <div class="row mb-3">
                <div class="col-4 text-right">
                    <label for="id_email">Email:</label>
                </div>
                <div class="col-8">
                    {{ form.email }}
                </div>
            </div>

            <!-- Phone number input field -->
            <div class="row mb-3">
                <div class="col-4 text-right">
                    <label for="id_phone_number">Phone Number:</label>
                </div>
                <div class="col-8">
                    {{ form.phone_number }}
                </div>
            </div>

            <!-- Work address input field -->
            <div class="row mb-3">
                <div class="col-4 text-right">
                    <label for="id_work_address">Work Address:</label>
                </div>
                <div class="col-8">
                    {{ form.work_address }}
                </div>
            </div>

            <!-- Display fixed company name in a readonly input -->
            <div class="row mb-3">
                <div class="col-4 text-right">
                    <label>Company:</label>
                </div>
                <div class="col-8">
                    <input type="text" class="form-control readonly-field" value="{{ fixed_company }}" readonly>
                </div>
            </div>

            <!-- Work division input field -->
            <div class="row mb-3">
                <div class="col-4 text-right">
                    <label for="id_work_division">Work Division:</label>
                </div>
                <div class="col-8">
                    {{ form.work_division }}
                </div>
            </div>

            <!-- Job role input field -->
            <div class="row mb-3">
                <div class="col-4 text-right">
                    <label for="id_job_role">Job Role:</label>
                </div>
                <div class="col-8">
                    {{ form.job_role }}
                </div>
            </div>

            <!-- Display user type in a readonly input -->
            <div class="row mb-3">
                <div class="col-4 text-right">
                    <label>User Type:</label>
                </div>
                <div class="col-8">
                    <input type="text" class="form-control readonly-field" value="{{ user_type }}" readonly>
                </div>
            </div>

            <!-- Submit button to save changes -->
            <div class="row mt-4">
                <div class="col-4"></div>
                <div class="col-8">
                    <button type="submit" class="btn btn-save-changes w-100">Save Changes</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
