{% if row.can_edit %}
<form action="{% url 'edit_booking' row.id %}" method="get" class="d-inline">
  <button type="submit" class="btn btn-primary btn-sm">Edit</button>
</form>
{% endif %}
{% if row.can_delete %}
<form method="post" action="{% url 'delete_booking' row.id %}" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this booking?');">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger btn-sm">Delete</button>
</form>
{% endif %}
