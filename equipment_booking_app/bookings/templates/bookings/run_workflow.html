{% extends 'bookings/base.html' %}

{% block content %}
<h2 class="text-center mb-4">Run Workflow</h2>
<div class="card p-4 w-75 mx-auto mb-4" style="color:#192d38;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_workflow">Workflow</label>
            {{ form.workflow }}
        </div>
        <div class="form-group">
            <label for="id_input_path">File Path</label>
            {{ form.input_path }}
        </div>
        <div class="form-group">
            <label for="id_project_code">Project Code</label>
            {{ form.project_code }}
        </div>
        <div class="form-group">
            <label for="id_initials">Initials</label>
            {{ form.initials }}
        </div>
        <button type="submit" class="btn btn-primary mt-3">Run Workflow</button>
    </form>
</div>

{% if logs %}
<h3 class="mt-4">Progress</h3>
<ul class="list-group w-75 mx-auto" style="color:#192d38;">
    {% for line in logs %}
    <li class="list-group-item">{{ line }}</li>
    {% endfor %}
</ul>
{% endif %}
{% endblock %}
